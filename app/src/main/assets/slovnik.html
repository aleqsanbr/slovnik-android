<title>Словник</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&family=Spectral:ital,wght@0,400;0,600;1,400&display=swap">
<style>
/* Layout: one narrow app column, index-card review in the middle, tab bar fixed to the bottom. */
:root{
  --bg:#ECEFF3; --surface:#FFFFFF; --ink:#1B2232; --muted:#667085; --line:#D9DEE6;
  --accent:#2747A8; --accent-ink:#FFFFFF; --rule:#CADBEE; --redrule:#E39AA4;
  --good:#2C7A57; --hard:#A86C12; --bad:#B93A33; --chip:#E2E7F0;
  --f-card:"Spectral", Georgia, "Times New Roman", serif;
  --f-ui:"Golos Text", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --nav-h:62px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#11141A; --surface:#1A1F28; --ink:#E5E8EE; --muted:#8D96A7; --line:#2A3140;
  --accent:#8EA6FF; --accent-ink:#0E1220; --rule:#243246; --redrule:#7C3C47;
  --good:#5CC497; --hard:#E1B252; --bad:#F0807A; --chip:#262D3A; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#11141A; --surface:#1A1F28; --ink:#E5E8EE; --muted:#8D96A7; --line:#2A3140;
  --accent:#8EA6FF; --accent-ink:#0E1220; --rule:#243246; --redrule:#7C3C47;
  --good:#5CC497; --hard:#E1B252; --bad:#F0807A; --chip:#262D3A; color-scheme:dark }
/* static fallbacks for the tonal tokens */
:root{ --seed:#4A5BB8; --accent-soft:#DCE2F7; --accent-soft-ink:#1B2A66; --ease:cubic-bezier(.2,0,0,1); --spring:cubic-bezier(.34,1.4,.64,1) }
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --accent-soft:#2A3456; --accent-soft-ink:#DCE2FF }}
:root[data-theme="dark"]{ --accent-soft:#2A3456; --accent-soft-ink:#DCE2FF }
/* Material You: every neutral and accent tone derived from one seed color */
@supports (color: oklch(from red l c h)){
  :root{
    --bg: oklch(from var(--seed) 0.968 0.014 h); --surface: oklch(from var(--seed) 0.993 0.006 h);
    --ink: oklch(from var(--seed) 0.24 0.02 h); --muted: oklch(from var(--seed) 0.5 0.025 h);
    --line: oklch(from var(--seed) 0.885 0.02 h); --chip: oklch(from var(--seed) 0.925 0.03 h);
    --accent: oklch(from var(--seed) 0.5 max(0.02, min(c, 0.16)) h); --accent-ink: oklch(from var(--seed) 0.99 0.01 h);
    --accent-soft: oklch(from var(--seed) 0.9 max(0.015, min(c, 0.07)) h); --accent-soft-ink: oklch(from var(--seed) 0.3 max(0.02, min(c, 0.1)) h);
    --rule: oklch(from var(--seed) 0.87 0.045 h); --redrule: oklch(from var(--seed) 0.72 0.12 calc(h + 140));
  }
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
    --bg: oklch(from var(--seed) 0.17 0.014 h); --surface: oklch(from var(--seed) 0.215 0.018 h);
    --ink: oklch(from var(--seed) 0.93 0.012 h); --muted: oklch(from var(--seed) 0.7 0.025 h);
    --line: oklch(from var(--seed) 0.31 0.022 h); --chip: oklch(from var(--seed) 0.27 0.03 h);
    --accent: oklch(from var(--seed) 0.8 max(0.02, min(c, 0.12)) h); --accent-ink: oklch(from var(--seed) 0.22 0.05 h);
    --accent-soft: oklch(from var(--seed) 0.33 max(0.015, min(c, 0.07)) h); --accent-soft-ink: oklch(from var(--seed) 0.9 0.04 h);
    --rule: oklch(from var(--seed) 0.3 0.04 h); --redrule: oklch(from var(--seed) 0.48 0.1 calc(h + 140)); }}
  :root[data-theme="dark"]{
    --bg: oklch(from var(--seed) 0.17 0.014 h); --surface: oklch(from var(--seed) 0.215 0.018 h);
    --ink: oklch(from var(--seed) 0.93 0.012 h); --muted: oklch(from var(--seed) 0.7 0.025 h);
    --line: oklch(from var(--seed) 0.31 0.022 h); --chip: oklch(from var(--seed) 0.27 0.03 h);
    --accent: oklch(from var(--seed) 0.8 max(0.02, min(c, 0.12)) h); --accent-ink: oklch(from var(--seed) 0.22 0.05 h);
    --accent-soft: oklch(from var(--seed) 0.33 max(0.015, min(c, 0.07)) h); --accent-soft-ink: oklch(from var(--seed) 0.9 0.04 h);
    --rule: oklch(from var(--seed) 0.3 0.04 h); --redrule: oklch(from var(--seed) 0.48 0.1 calc(h + 140)); }
}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.app{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px calc(var(--nav-h) + 28px + env(safe-area-inset-bottom,0px))}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* header */
.top{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:16px}
.brand{font-family:var(--f-card);font-size:1.7rem;font-weight:600;letter-spacing:-.01em}
.brand i{font-weight:400;color:var(--muted)}
.counts{font-size:.82rem;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
.sync{display:inline-block;margin-top:2px;font-size:.72rem;letter-spacing:.04em;text-transform:uppercase}
.sync.on{color:var(--good)} .sync.off{color:var(--hard)}
.hdr-right{display:flex;align-items:center;gap:10px}
:fullscreen{background:var(--bg)}
:fullscreen .app{min-height:100%}
::backdrop{background:var(--bg)}

/* generic */
h2{font-size:.78rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:22px 0 10px}
h2:first-child{margin-top:4px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:grid;gap:12px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.grow{flex:1 1 140px;min-width:0}
label.f{display:grid;gap:5px;font-size:.82rem;color:var(--muted)}
input[type=text],input[type=search],input[type=time],select,textarea{width:100%;box-sizing:border-box;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 11px;font-size:16px;color:var(--ink)}
textarea{min-height:120px;resize:vertical;line-height:1.4}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:10px 14px;font-weight:500}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,var(--line))}
.btn.danger.solid{background:var(--bad);color:var(--surface);border-color:var(--bad)}
.btn:disabled{opacity:.5;cursor:default}
.btn.wide{width:100%}
.link{background:none;border:0;padding:0;color:var(--accent);text-decoration:underline;text-underline-offset:3px;font-size:.88rem}
.hint{font-size:.84rem;color:var(--muted)}
.seg{display:inline-flex;background:var(--chip);border-radius:9px;padding:3px;gap:2px}
.seg button{border:0;background:none;padding:7px 12px;border-radius:7px;font-size:.88rem;font-weight:500;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:.76rem;background:var(--chip);border-radius:99px;padding:2px 9px;color:var(--muted);white-space:nowrap}
.chip.warn{color:var(--hard)}

/* level pips */
.pips{display:inline-flex;gap:3px;vertical-align:middle}
.pips i{width:7px;height:7px;border-radius:50%;background:var(--line)}
.pips i.on{background:var(--accent)}
.lvrow{display:flex;align-items:center;gap:6px;font-size:.7rem;color:var(--muted);font-variant-numeric:tabular-nums}

/* index card */
.stage{display:grid;gap:14px}
.card{position:relative;background:var(--surface);border-radius:6px;box-shadow:0 1px 0 var(--line),0 8px 24px -14px rgba(20,30,60,.35);
  min-height:300px;padding:22px 20px 20px;cursor:pointer;user-select:none;
  background-image:linear-gradient(var(--redrule),var(--redrule)),repeating-linear-gradient(to bottom,transparent 0,transparent 27px,var(--rule) 27px,var(--rule) 28px);
  background-size:100% 2px,100% calc(100% - 92px);background-position:0 78px,0 92px;background-repeat:no-repeat}
.card .meta{position:absolute;top:10px;right:14px;display:flex;gap:6px;align-items:center}
.card .front{font-family:var(--f-card);font-size:clamp(1.5rem,6vw,2.1rem);font-weight:600;line-height:1.15;min-height:56px;display:flex;align-items:flex-end;padding-right:70px;overflow-wrap:anywhere;text-wrap:balance}
.card .body{margin-top:26px;display:grid;gap:12px;font-size:1rem;line-height:28px}
.card .answer{font-family:var(--f-card);font-size:1.3rem;font-weight:400}
.card .note{color:var(--muted);font-size:.92rem;line-height:28px}
.card .ctx{font-family:var(--f-card);font-style:italic;font-size:1rem;line-height:28px}
.card mark{background:none;color:var(--accent);font-weight:600;font-style:normal}
.card .tap{color:var(--muted);font-size:.86rem;text-align:center;margin-top:28px}
.grades{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.grades button{border-radius:10px;padding:13px 6px;font-weight:600;border:1px solid var(--line);background:var(--surface);display:grid;gap:2px}
.grades small{font-weight:400;font-size:.72rem;color:var(--muted)}
.g-bad{color:var(--bad)} .g-hard{color:var(--hard)} .g-good{color:var(--good)}
.progress{height:4px;background:var(--line);border-radius:99px;overflow:hidden}
.progress span{display:block;height:100%;background:var(--accent);transition:width .25s}
.bigstat{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.bigstat div{background:var(--bg);border-radius:9px;padding:10px 4px}
.bigstat b{display:block;font-size:1.4rem;font-variant-numeric:tabular-nums}
.bigstat span{font-size:.75rem;color:var(--muted)}

/* dictionary */
.list{display:grid;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;padding:11px 14px;border-top:1px solid var(--line);text-align:left;background:none;border-left:0;border-right:0;border-bottom:0;width:100%}
.item:first-child{border-top:0}
.item .en{font-family:var(--f-card);font-weight:600;font-size:1.08rem;overflow-wrap:anywhere}
.item .ru{color:var(--muted);font-size:.9rem;overflow-wrap:anywhere;grid-column:1}
.item .lv{grid-column:2;grid-row:1 / span 2;display:grid;gap:4px;align-content:center}
.empty{padding:28px 18px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-family:var(--f-card);font-size:1.2rem;margin-bottom:4px}

/* bottom nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
.nav div{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);height:var(--nav-h)}
.nav button{border:0;background:none;color:var(--muted);font-size:.74rem;font-weight:500;display:grid;justify-items:center;align-content:center;gap:3px}
.nav button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.nav button[aria-current="page"]{color:var(--accent)}

/* modal */
.scrim{position:fixed;inset:0;z-index:30;background:rgba(10,14,24,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:560px;max-height:88vh;overflow:auto;border-radius:16px 16px 0 0;box-sizing:border-box;
  padding:18px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:grid;gap:12px}
@media (min-width:600px){.scrim{align-items:center}.sheet{border-radius:16px}}
.sheet h3{margin:0;font-family:var(--f-card);font-size:1.3rem;font-weight:600}
.emojis{display:flex;flex-wrap:wrap;gap:6px}
.emojis button{width:38px;height:38px;border-radius:8px;border:1px solid var(--line);background:var(--bg);font-size:1.1rem}
.emojis button[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.setrow{display:flex;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.setrow:last-child{border-bottom:0}
.setrow .nm{flex:1;min-width:0;overflow-wrap:anywhere}
.log{font-size:.84rem;color:var(--muted);white-space:pre-wrap;max-height:160px;overflow:auto}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--nav-h) + 16px + env(safe-area-inset-bottom,0px));z-index:40;background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:10px;font-size:.88rem;max-width:calc(100% - 40px);box-sizing:border-box}
ol.steps{margin:0;padding-left:20px;display:grid;gap:4px}

/* ---- Material 3 shapes ---- */
body,.app{transition:background-color .4s var(--ease),color .4s var(--ease)}
.panel{border-radius:22px;border-color:transparent;background:var(--surface)}
.list{border-radius:22px;border-color:transparent}
.btn{border-radius:99px;padding:11px 18px;transition:transform .15s var(--ease),background-color .2s,box-shadow .2s}
.btn:not(.primary):not(.danger){background:var(--accent-soft);border-color:transparent;color:var(--accent-soft-ink)}
.btn.primary:not(:disabled):hover{box-shadow:0 2px 8px -2px color-mix(in srgb,var(--accent) 60%,transparent)}
.btn:active:not(:disabled),.grades button:active,.emojis button:active{transform:scale(.96)}
input[type=text],input[type=search],input[type=time],select,textarea{border-radius:14px;transition:border-color .2s,box-shadow .2s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent)}
.seg{border-radius:99px;padding:4px}
.seg button{border-radius:99px;transition:background-color .25s var(--ease),color .25s}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent-soft-ink);box-shadow:none}
.bigstat div{border-radius:16px;background:var(--chip)}
.grades button{border-radius:18px;border-color:transparent;transition:transform .15s var(--ease)}
.grades .g-bad{background:color-mix(in srgb,var(--bad) 14%,var(--surface))}
.grades .g-hard{background:color-mix(in srgb,var(--hard) 14%,var(--surface))}
.grades .g-good{background:color-mix(in srgb,var(--good) 14%,var(--surface))}
.item{transition:background-color .15s}
.item:active{background:var(--chip)}
.sheet{border-radius:28px 28px 0 0}
@media (min-width:600px){.sheet{border-radius:28px}}
.emojis button{border-radius:12px;transition:transform .15s var(--ease)}
.emojis button[aria-pressed="true"]{background:var(--accent-soft)}
.toast{border-radius:14px}
.pips i{transition:background-color .3s,transform .3s var(--spring)}
/* nav bar with active pill indicator */
.nav{background:var(--surface);border-top:0}
.nav button{gap:4px}
.nav button svg{width:56px;height:30px;padding:4px 17px;box-sizing:border-box;border-radius:99px;transition:background-color .3s var(--ease),transform .3s var(--spring)}
.nav button[aria-current="page"]{color:var(--accent-soft-ink)}
.nav button[aria-current="page"] svg{background:var(--accent-soft);transform:scale(1.04)}
/* theme swatches */
.swatches{display:flex;flex-wrap:wrap;gap:10px}
.swatches button{width:44px;height:44px;border-radius:50%;border:0;padding:0;position:relative;background:var(--sw);box-shadow:inset 0 0 0 1px rgba(0,0,0,.08);transition:transform .2s var(--spring)}
.swatches button[aria-pressed="true"]{transform:scale(1.08);box-shadow:0 0 0 3px var(--bg),0 0 0 5px var(--sw)}
.swatches button.sys{background:conic-gradient(from 0deg,#e66,#eb5,#6c6,#5be,#86e,#e66)}
.swatches button.sys::after{content:"A";position:absolute;inset:0;display:grid;place-items:center;font-weight:600;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.5)}

/* ---- motion ---- */
@keyframes viewIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes cardIn{from{opacity:0;transform:translateX(36px) rotate(1.5deg)}to{opacity:1;transform:none}}
@keyframes cardFlip{from{transform:perspective(900px) rotateY(-80deg);opacity:.4}to{transform:perspective(900px) rotateY(0);opacity:1}}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.12)}100%{transform:scale(1);opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes sheetUp{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,12px)}to{opacity:1;transform:translate(-50%,0)}}
.anim-view{animation:viewIn .32s var(--ease) both}
.card.anim-next{animation:cardIn .38s var(--ease) both}
.card.anim-flip{animation:cardFlip .42s var(--ease) both}
.card.anim-flip .answer,.card.anim-flip .note,.card.anim-flip .ctx,.card.anim-flip .chip{animation:rise .35s var(--ease) both}
.card.anim-flip .note{animation-delay:.06s}.card.anim-flip .ctx{animation-delay:.1s}
.grades.anim-in button{animation:rise .3s var(--ease) both}
.grades.anim-in button:nth-child(2){animation-delay:.04s}.grades.anim-in button:nth-child(3){animation-delay:.08s}
.anim-view .item{animation:rise .3s var(--ease) both;animation-delay:calc(min(var(--i,0),12) * 22ms)}
.anim-done .bigstat b{animation:pop .5s var(--spring) both}
.anim-done .bigstat div:nth-child(2) b{animation-delay:.08s}.anim-done .bigstat div:nth-child(3) b{animation-delay:.16s}
.scrim{animation:fade .2s ease both}
.sheet{animation:sheetUp .32s var(--ease) both}
.toast{animation:toastIn .25s var(--ease) both}
.card{transition:box-shadow .25s}

.streak-chip{display:inline-flex;align-items:center;gap:2px;margin-right:8px;color:var(--muted);vertical-align:-3px}
.streak-chip svg{width:16px;height:16px;fill:currentColor}
.streak-chip.lit{color:var(--accent)}
.streak{background:var(--surface);border-radius:22px;padding:14px 16px;display:grid;gap:12px;margin-bottom:6px}
.streak-head{display:flex;align-items:center;gap:12px}
.streak-head .grow{display:grid;gap:2px}
.streak-flame{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:var(--chip);color:var(--muted);flex:none}
.streak.lit .streak-flame{background:var(--accent-soft);color:var(--accent);animation:pop .5s var(--spring) both}
.streak-flame svg{width:24px;height:24px;fill:currentColor}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center;font-size:.72rem;color:var(--muted)}
.week span{display:grid;justify-items:center;gap:4px}
.week i{width:22px;height:22px;border-radius:50%;background:var(--chip);display:block}
.week .on i{background:var(--accent)}
.week .today{color:var(--ink);font-weight:600}
.week .today i{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--accent-soft)}
.item.picked{background:var(--accent-soft)}
.check{width:22px;height:22px;border-radius:50%;border:2px solid var(--muted);box-sizing:border-box;display:block}
.item.picked .check{border-color:var(--accent);background:var(--accent) radial-gradient(circle,var(--accent-ink) 0 3px,transparent 3.5px)}
.selbar{position:fixed;left:0;right:0;bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px));z-index:19;background:var(--surface);box-shadow:0 -6px 18px -10px rgba(0,0,0,.35);border-radius:22px 22px 0 0;
  padding:12px max(16px,env(safe-area-inset-right,0px)) 12px max(16px,env(safe-area-inset-left,0px));display:grid;gap:10px;max-width:560px;margin:0 auto;box-sizing:border-box}
.selbar ~ *{}
#dlist:has(~ .selbar){margin-bottom:170px}
.say{flex:none;width:36px;height:36px;border-radius:50%;border:0;display:inline-grid;place-items:center;background:var(--accent-soft);color:var(--accent-soft-ink);transition:transform .15s var(--ease)}
.say:active{transform:scale(.9)}
.say svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.card .front{gap:10px;justify-content:space-between}

<div id="modal"></div>

<script>
(function(){
"use strict";
/* This page's own source, captured before the first render, so the Android app can keep an up-to-date offline copy. */
const PAGE_SOURCE = (() => {
  try{
    const me = document.currentScript;
    const pick = sel => [...document.querySelectorAll(sel)];
    const parts = [
      ...pick("title").slice(0, 1),
      ...pick('link[href*="fonts.googleapis.com"]'),
      ...pick("style").filter(st => st.textContent.includes("--f-card")),
      ...pick("body > .app, body > nav.nav, body > #modal")
    ].map(n => n.outerHTML);
    return parts.join("\n") + "<script>" + me.textContent + "<\/script>";
  }catch(e){ return ""; }
})();
const LS_KEY = "slovnik.v1";
const MAX_LV = 6;
const MIN = 60e3, DAY = 864e5;
const INTERVALS = [10*MIN, 1*DAY, 3*DAY, 7*DAY, 14*DAY, 30*DAY, 60*DAY];
const EMOJIS = ["📕","📗","📘","📙","📚","📖","🎮","🎬","📰","🎧","✍️","🧠","⭐","🌍","🏛️","🔬","💼","🎵"];
const DEFAULT_META = { sets: [], level: "B1–B2", dir: "en", sessionLen: 20, revSet: "all", ttsAuto: false, accent: "en-US", sound: true, haptics: true,
  notif: { on: true, time: "19:00", quiz: 2, quietFrom: "22:00", quietTo: "09:00" }, days: [] };

const S = {
  words: new Map(), meta: structuredClone(DEFAULT_META),
  mode: "local", localSource: "local", db: null, uid: null,
  sample: null, downloads: null, capsReady: false,
  tab: "review", session: null, dictQuery: "", dictSet: "all",
  bulk: { running: false, confirm: null, log: "" }
};

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const key = s => String(s||"").trim().toLowerCase().replace(/\s+/g," ");
const uid = () => "w" + Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const sid = () => "s" + Date.now().toString(36) + Math.random().toString(36).slice(2,5);
const plural = (n, a, b, c) => { const m10=n%10, m100=n%100; return n + " " + (m10===1&&m100!==11 ? a : m10>=2&&m10<=4&&(m100<10||m100>=20) ? b : c); };
function toast(msg){ const t=document.createElement("div"); t.className="toast"; t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(), 3200); }
const num = (v, d=0) => typeof v === "number" && isFinite(v) ? v : d;
const clampLv = v => Math.max(0, Math.min(MAX_LV, Math.round(num(v))));

function normWord(w){
  const lv = w.lv && typeof w.lv === "object" ? w.lv : {};
  const due = w.due && typeof w.due === "object" ? w.due : {};
  return {
    id: String(w.id || uid()), en: String(w.en||"").trim(), ru: String(w.ru||"").trim(),
    note: String(w.note||""), context: String(w.context||""), set: w.set ? String(w.set) : "",
    lv: { en: clampLv(lv.en), ru: clampLv(lv.ru) }, due: { en: num(due.en), ru: num(due.ru) },
    ok: num(w.ok), bad: num(w.bad), added: num(w.added, Date.now())
  };
}
const plain = w => ({ en:w.en, ru:w.ru, note:w.note, context:w.context, set:w.set, lv:{...w.lv}, due:{...w.due}, ok:w.ok, bad:w.bad, added:w.added });
const setById = id => S.meta.sets.find(s => s.id === id);
const setLabel = id => { const s = setById(id); return s ? (s.emoji + " " + s.name) : "Без набора"; };
const reviewable = w => !!w.ru;
const pips = n => '<span class="pips">' + Array.from({length:MAX_LV},(_,i)=>`<i class="${i<n?"on":""}"></i>`).join("") + "</span>";

/* ---------- Android app bridge ---------- */
const NATIVE = (() => { try{ return window.SlovnikNative && window.SlovnikNative.isApp() ? window.SlovnikNative : null; }catch(e){ return null; } })();
const OFFLINE = (() => { try{ return !!(NATIVE && NATIVE.isOffline()); }catch(e){ return false; } })();
const nativeCall = (fn, ...a) => { try{ return NATIVE && typeof NATIVE[fn] === "function" ? NATIVE[fn](...a) : undefined; }catch(e){ return undefined; } };
const nativePending = () => +(nativeCall("pendingCount") || 0);
/* the app keeps a copy of the dictionary so it can open Словник without a network */
function reportSnapshot(){
  if(!NATIVE || !(OFFLINE || S.mode === "db")) return;
  clearTimeout(reportSnapshot.t);
  reportSnapshot.t = setTimeout(() => nativeCall("saveSnapshot", JSON.stringify({ meta:S.meta, seed:getSeed(), words:[...S.words.values()].map(w => ({ id:w.id, ...plain(w) })) })), 1200);
}
function reportPage(){
  if(!NATIVE || OFFLINE || !PAGE_SOURCE || PAGE_SOURCE.length < 5000) return;
  setTimeout(() => nativeCall("savePage", PAGE_SOURCE), 2500);
}
function loadOfflineSnapshot(){
  let d = null; try{ d = JSON.parse(nativeCall("snapshot") || "null"); }catch(e){}
  if(!d){ S.noSnapshot = true; return; }
  S.words = new Map(); (d.words || []).forEach(w => { const n = normWord(w); S.words.set(n.id, n); });
  if(d.meta) S.meta = { ...structuredClone(DEFAULT_META), ...d.meta };
  if(d.seed) applySeed(d.seed);
}
/* changes made in the offline copy, handed over by the app once Словник is online again */
function mergeNativePending(){
  if(!NATIVE || OFFLINE) return;
  let p = null; try{ p = JSON.parse(nativeCall("takePending") || "null"); }catch(e){}
  if(!p) return;
  let n = 0; const ws = p.words || {};
  for(const id of Object.keys(ws)){
    const v = ws[id];
    if(v) S.words.set(id, normWord({ ...v, id })); else S.words.delete(id);
    markWord(id); n++;
  }
  if(p.meta){ S.meta = { ...structuredClone(DEFAULT_META), ...p.meta }; markMeta(); n++; }
  nativeCall("clearPending");
  if(n){ saveLocal(); toast("Перенёс в облако " + plural(n, "изменение", "изменения", "изменений") + ", сделанные без сети"); }
}

/* ---------- local cache ---------- */
function loadLocal(){
  try{
    const d = JSON.parse(localStorage.getItem(LS_KEY) || "null");
    if(!d) return;
    (d.words||[]).forEach(w => { const n = normWord(w); S.words.set(n.id, n); });
    if(d.meta) S.meta = { ...structuredClone(DEFAULT_META), ...d.meta };
    S.localSource = d.source || "local";
  }catch(e){}
}
function saveLocal(){
  clearTimeout(saveLocal.t);
  saveLocal.t = setTimeout(() => {
    try{ localStorage.setItem(LS_KEY, JSON.stringify({ source:S.mode, meta:S.meta, words:[...S.words.values()].map(w=>({id:w.id,...plain(w)})) })); }catch(e){}
  }, 250);
  reportSnapshot();
}

/* ---------- cloud sync with an offline outbox ----------
   Every change is first written to the outbox (kept in this browser), then sent.
   An entry leaves the outbox only after the cloud confirmed it, so nothing is lost offline. */
const OB_KEY = "slovnik.outbox";
const OB = (() => { try{ const o = JSON.parse(localStorage.getItem(OB_KEY) || "null"); if(o && o.w) return o; }catch(e){} return { w:{}, meta:0 }; })();
let obGen = Date.now();
const sleep = ms => new Promise(r => setTimeout(r, ms));
const obCount = () => Object.keys(OB.w).length + (OB.meta ? 1 : 0);
function obSave(){
  clearTimeout(obSave.t);
  obSave.t = setTimeout(() => { try{ localStorage.setItem(OB_KEY, JSON.stringify(OB)); }catch(e){} renderHeader(); }, 120);
}
const WQ = { pending: new Set(), running: new Set() };
const dirty = k => WQ.pending.has(k) || WQ.running.has(k) || (k === "meta" ? !!OB.meta : (k.startsWith("w:") && (k.slice(2) in OB.w)));
function schedule(k){ if(!S.db) return; WQ.pending.add(k); pump(); }
function markWord(id){ OB.w[id] = ++obGen; obSave(); schedule("w:"+id); }
function markMeta(){ OB.meta = ++obGen; obSave(); schedule("meta"); }
function pump(){
  while(WQ.running.size < 4){
    const k = [...WQ.pending].find(x => !WQ.running.has(x));
    if(!k) break;
    WQ.pending.delete(k); WQ.running.add(k);
    send(k).finally(() => { WQ.running.delete(k); pump(); });
  }
}
async function send(k){
  const isMeta = k === "meta", id = isMeta ? null : k.slice(2);
  const gen = isMeta ? OB.meta : OB.w[id];
  if(!gen) return;
  const op = () => {
    if(isMeta) return profileRef().set(structuredClone(S.meta));
    const w = S.words.get(id);
    return w ? wordsCol().doc(id).set(plain(w)) : wordsCol().doc(id).delete();
  };
  let err = null;
  try{ await op(); }
  catch(e){
    err = e;
    if(e && e.code === "unavailable"){ await sleep(600 + Math.random()*900); try{ await op(); err = null; }catch(e2){ err = e2; } }
  }
  if(err){ onSendError(err); return; }
  if(isMeta){ if(OB.meta === gen) OB.meta = 0; } else if(OB.w[id] === gen) delete OB.w[id];
  if(!obCount()) S.offlineToast = false;
  obSave();
}
function onSendError(e){
  const code = e && e.code;
  if(code === "quota_exceeded"){ toast("Облачное хранилище заполнено. Удали часть слов, чтобы добавлять новые."); return; }
  if(code === "invalid_argument" || code === "revoked"){ toast("Облако не приняло изменение. Оно осталось на этом устройстве."); return; }
  if(!S.offlineToast){ S.offlineToast = true; toast("Нет связи. Изменения сохранены и отправятся сами."); }
  clearTimeout(onSendError.t); onSendError.t = setTimeout(flushOutbox, 15000);
}
function flushOutbox(){
  if(!S.db){ connectCloud(); return; }
  Object.keys(OB.w).forEach(id => WQ.pending.add("w:"+id));
  if(OB.meta) WQ.pending.add("meta");
  pump();
}
window.addEventListener("online", () => flushOutbox());
document.addEventListener("visibilitychange", () => {
  if(document.visibilityState !== "visible" || !NATIVE) return;
  mergeNativeDays(); renderHeader();
  if(OFFLINE){ if(!S.session){ loadOfflineSnapshot(); refresh(true); } }
  else if(S.db && nativePending()){ mergeNativePending(); reportSnapshot(); refresh(true); }
});
document.addEventListener("visibilitychange", () => { if(document.visibilityState === "visible" && obCount()) flushOutbox(); });
setInterval(() => { if(obCount() && !WQ.running.size) flushOutbox(); }, 30000);

const profileRef = () => S.db.doc("data/users/" + S.uid + "/profile");
const wordsCol = () => profileRef().collection("words");
function persistWord(w){ S.words.set(w.id, w); saveLocal(); if(OFFLINE) return offlinePut(w.id, w); markWord(w.id); }
function removeWord(id){ S.words.delete(id); saveLocal(); if(OFFLINE) return offlinePut(id, null); markWord(id); }
function persistMeta(){ saveLocal(); if(OFFLINE){ nativeCall("pendingMeta", JSON.stringify(S.meta)); renderHeader(); return; } markMeta(); }
function offlinePut(id, w){ nativeCall("pendingPut", id, w ? JSON.stringify({ id, ...plain(w) }) : ""); renderHeader(); }

/* ---------- capabilities & sync ---------- */
async function initCaps(){
  const c = window.claude;
  if(!c || typeof c.use !== "function"){ S.capsReady = true; refresh(); return; }
  const get = n => c.use(n).catch(() => null);
  const [db, user, sample, downloads] = await Promise.all([get("db"), get("user"), get("sample"), get("downloads")]);
  S.sample = sample; S.downloads = downloads; S.capsReady = true;
  if(db && user){ S.cloud = { db, user }; await connectCloud(); }
  refresh();
}
async function connectCloud(){
  if(!S.cloud || S.db || connectCloud.busy) return;
  connectCloud.busy = true;
  try{
    if(!S.uid){ try{ S.uid = await S.cloud.user.id(); }catch(e){} }
    if(!S.uid) return;
    S.db = S.cloud.db;
    try{ await startSync(); mergeNativePending(); mergeNativeDays(); reportSnapshot(); nativeCall("jsLog", "облако подключено: " + S.words.size + " слов"); }
    catch(e){
      S.db = null; S.mode = "local";
      if(!S.offlineToast){ S.offlineToast = true; toast("Нет связи с облаком. Работаю на этом устройстве и синхронизирую, когда появится сеть."); }
    }
  } finally { connectCloud.busy = false; refresh(true); }
}
async function startSync(){
  const [m, ws] = await Promise.all([profileRef().get(), wordsCol().get()]);
  S.mode = "db";
  if(!m.exists && ws.empty){
    if(S.localSource !== "db" && (S.words.size || S.meta.sets.length)){
      markMeta(); for(const id of S.words.keys()) markWord(id);
      toast("Слова с этого устройства перенесены в облако.");
    } else {
      for(const id of [...S.words.keys()]) if(!(id in OB.w)) S.words.delete(id);
      if(!OB.meta) S.meta = structuredClone(DEFAULT_META);
    }
  } else applyCloud(m, ws);
  saveLocal();
  if(!startSync.subscribed){
    startSync.subscribed = true;
    profileRef().onSnapshot(snap => { if(!dirty("meta") && snap.exists){ S.meta = { ...structuredClone(DEFAULT_META), ...structuredClone(snap.data()) }; saveLocal(); refresh(true); } }, () => {});
    wordsCol().onSnapshot(snap => { applyWords(snap); saveLocal(); refresh(true); }, () => {});
  }
  flushOutbox();
}
function applyCloud(m, ws){
  if(m.exists && !dirty("meta")) S.meta = { ...structuredClone(DEFAULT_META), ...structuredClone(m.data()) };
  applyWords(ws);
}
function applyWords(snap){
  const next = new Map();
  snap.docs.forEach(d => { if(!dirty("w:"+d.id)) next.set(d.id, normWord({ id:d.id, ...d.data() })); });
  for(const [id, w] of S.words){ if(dirty("w:"+id)) next.set(id, w); }
  S.words = next;
}

/* ---------- speech, sounds, haptics ---------- */
const SAY_ICON = '<svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/></svg>';
const sayBtn = (text, extra) => `<button class="say" type="button" data-say="${esc(text)}" aria-label="Прослушать" title="Прослушать"${extra||""}>${SAY_ICON}</button>`;
const hasNativeSpeech = () => !!(NATIVE && typeof NATIVE.speak === "function");
const canSpeak = () => hasNativeSpeech() || ("speechSynthesis" in window);
function speak(text){
  text = String(text || "").trim(); if(!text) return;
  const lang = S.meta.accent || "en-US";
  if(hasNativeSpeech()){ nativeCall("speak", text, lang); return; }
  try{
    const ss = window.speechSynthesis; if(!ss) return;
    ss.cancel();
    const u = new SpeechSynthesisUtterance(text); u.lang = lang; u.rate = 0.95;
    const vs = ss.getVoices();
    const v = vs.find(x => x.lang === lang || x.lang === lang.replace("-", "_")) || vs.find(x => (x.lang || "").toLowerCase().startsWith("en"));
    if(v) u.voice = v;
    ss.speak(u);
  }catch(e){}
}
function wireSay(root){
  root.querySelectorAll("[data-say]").forEach(b => b.onclick = e => { e.stopPropagation(); haptic("tick"); speak(b.dataset.say); });
}
let actx = null;
function tone(f, t0, dur, type, g){
  const o = actx.createOscillator(), gn = actx.createGain();
  o.type = type || "sine"; o.frequency.setValueAtTime(f, t0);
  gn.gain.setValueAtTime(0.0001, t0);
  gn.gain.exponentialRampToValueAtTime(g || 0.07, t0 + 0.012);
  gn.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.connect(gn); gn.connect(actx.destination);
  o.start(t0); o.stop(t0 + dur + 0.03);
}
function fx(kind){
  if(S.meta.sound === false) return;
  try{
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    if(actx.state === "suspended") actx.resume();
  }catch(e){ return; }
  const t = actx.currentTime + 0.01;
  if(kind === "flip"){ tone(740, t, 0.06, "triangle", 0.035); tone(1110, t + 0.035, 0.07, "triangle", 0.025); }
  else if(kind === "good"){ tone(659, t, 0.12, "sine", 0.07); tone(988, t + 0.08, 0.2, "sine", 0.07); }
  else if(kind === "hard"){ tone(523, t, 0.18, "triangle", 0.06); }
  else if(kind === "bad"){ tone(294, t, 0.12, "sine", 0.08); tone(220, t + 0.09, 0.22, "sine", 0.08); }
  else if(kind === "done"){ [523, 659, 784, 1047].forEach((f, i) => tone(f, t + i * 0.09, 0.24, "sine", 0.06)); }
}
function haptic(kind){
  if(S.meta.haptics === false) return;
  if(NATIVE && typeof NATIVE.haptic === "function"){ nativeCall("haptic", kind); return; }
  try{ if(navigator.vibrate) navigator.vibrate(kind === "reject" ? [28, 40, 28] : kind === "confirm" ? 18 : 8); }catch(e){}
}
function feedback(kind){
  fx(kind);
  haptic(kind === "good" || kind === "done" ? "confirm" : kind === "bad" ? "reject" : "tick");
}

/* ---------- SRS ---------- */
function weightedTake(arr, n, weight){
  const pool = arr.map(x => ({ x, w: Math.max(0.01, weight(x)) })), out = [];
  while(out.length < n && pool.length){
    const total = pool.reduce((a,b)=>a+b.w,0); let r = Math.random()*total, i = 0;
    for(; i < pool.length-1; i++){ r -= pool[i].w; if(r <= 0) break; }
    out.push(pool.splice(i,1)[0].x);
  }
  return out;
}
function poolFor(dir, setId){
  return [...S.words.values()].filter(w => reviewable(w) && (setId==="all" || (setId==="none" ? !w.set : w.set===setId)));
}
/* "mix" reviews both directions; each card still updates the level of the direction it was shown in */
const DIRS = d => d === "mix" ? ["en","ru"] : [d];
const isDue = (w, d, now) => DIRS(d).some(x => w.due[x] <= now);
const lvOf = (w, d) => DIRS(d).reduce((a, x) => a + w.lv[x], 0) / DIRS(d).length;
const dirLabel = d => d === "en" ? "EN → RU" : d === "ru" ? "RU → EN" : "вперемешку";
function takeUnique(cands, n, weight, used){
  const pool = cands.filter(c => !used.has(c.w.id)).map(c => ({ c, wt: Math.max(0.01, weight(c)) })), out = [];
  while(out.length < n && pool.length){
    const total = pool.reduce((a,b) => a + b.wt, 0); let r = Math.random()*total, i = 0;
    for(; i < pool.length-1; i++){ r -= pool[i].wt; if(r <= 0) break; }
    const { c } = pool.splice(i, 1)[0];
    if(used.has(c.w.id)) continue;
    used.add(c.w.id); out.push(c);
  }
  return out;
}
function buildSession(){
  const n = S.meta.sessionLen, now = Date.now();
  const cands = poolFor(S.meta.dir, S.meta.revSet).flatMap(w => DIRS(S.meta.dir).map(x => ({ w, x })));
  const due = cands.filter(c => c.w.due[c.x] <= now), rest = cands.filter(c => c.w.due[c.x] > now);
  const words = new Set(cands.map(c => c.w.id)).size;
  const restWords = new Set(rest.map(c => c.w.id)).size;
  const keepForRest = Math.min(restWords, Math.max(2, Math.round(n*0.2)));
  const used = new Set();
  const a = takeUnique(due, Math.min(words, n - keepForRest), c => (MAX_LV+1-c.w.lv[c.x])**2, used);
  const b = takeUnique(rest, Math.min(words, n) - a.length, c => (MAX_LV+1-c.w.lv[c.x]) + 1, used);
  const q = [...a, ...b].map(c => ({ id: c.w.id, d: c.x }));
  for(let i = q.length-1; i > 0; i--){ const j = Math.floor(Math.random()*(i+1)); [q[i],q[j]] = [q[j],q[i]]; }
  return q;
}
/* ---------- streak ---------- */
const dayKey = d => d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
const todayKey = () => dayKey(new Date());
function shiftDay(d, n){ const x = new Date(d); x.setDate(x.getDate() + n); return x; }
function practiceDays(){ return new Set(Array.isArray(S.meta.days) ? S.meta.days : []); }
function streakInfo(){
  const days = practiceDays(), now = new Date();
  const doneToday = days.has(dayKey(now));
  let cur = 0, d = doneToday ? now : shiftDay(now, -1);
  while(days.has(dayKey(d))){ cur++; d = shiftDay(d, -1); }
  let best = 0, run = 0, prev = null;
  [...days].sort().forEach(k => {
    const t = new Date(k + "T12:00:00");
    run = prev && Math.round((t - prev) / DAY) === 1 ? run + 1 : 1;
    best = Math.max(best, run); prev = t;
  });
  const week = Array.from({ length: 7 }, (_, i) => { const x = shiftDay(now, i - 6); return { key: dayKey(x), on: days.has(dayKey(x)), today: i === 6, label: ["Вс","Пн","Вт","Ср","Чт","Пт","Сб"][x.getDay()] }; });
  return { cur, best: Math.max(best, cur), doneToday, week };
}
const FLAME = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5c.6 3.2-1.2 5-2.7 6.6C7.8 10.7 6.5 12.3 6.5 15a5.5 5.5 0 0 0 11 0c0-2.2-1-3.9-2.1-5.2-.3 1.4-1 2.4-2 2.9.3-3.6-.6-7.4-1.4-10.2z"/></svg>';

function mergeNativeDays(){
  let extra = []; try{ extra = JSON.parse(nativeCall("practiceDays") || "[]"); }catch(e){}
  const days = practiceDays(); let added = false;
  extra.forEach(k => { if(/^\d{4}-\d{2}-\d{2}$/.test(k) && !days.has(k)){ days.add(k); added = true; } });
  if(added){ S.meta.days = [...days].sort().slice(-90); persistMeta(); refresh(true); }
}
function markPracticeDay(){
  const today = todayKey();
  const days = Array.isArray(S.meta.days) ? S.meta.days : [];
  if(days.includes(today)) return;
  S.meta.days = [...days, today].slice(-90);
  persistMeta();
}
function grade(w, dir, g){
  markPracticeDay();
  const now = Date.now(); let lv = w.lv[dir];
  if(g === "bad"){ lv = Math.max(0, lv-2); w.due[dir] = now + 10*MIN; w.bad++; }
  else if(g === "hard"){ w.due[dir] = now + Math.max(10*MIN, INTERVALS[lv]/2); w.ok++; }
  else { lv = Math.min(MAX_LV, lv+1); w.due[dir] = now + INTERVALS[lv]; w.ok++; }
  w.lv[dir] = lv; persistWord(w);
}
function nextLabel(w, dir, g){
  const lv = w.lv[dir];
  const ms = g==="bad" ? 10*MIN : g==="hard" ? Math.max(10*MIN, INTERVALS[lv]/2) : INTERVALS[Math.min(MAX_LV, lv+1)];
  return ms < DAY ? (ms < 60*MIN ? Math.round(ms/MIN)+" мин" : Math.round(ms/36e5)+" ч") : Math.round(ms/DAY)+" дн";
}

/* ---------- Claude translation ---------- */
function buildPrompt(lines, sourceName){
  return "Ты помогаешь изучающему английский (родной язык русский, уровень " + S.meta.level + ") разобрать слова и фразы, которые он выписал"
    + (sourceName ? " из источника «" + sourceName + "»" : " при чтении") + ".\n\n"
    + "Каждая строка ниже — слово, фраза или предложение. Если в строке есть « | », то слева выписанное слово или фраза, а справа предложение из текста, где оно встретилось: используй его, чтобы выбрать правильное значение, и верни это предложение в поле context. Иначе context — пустая строка.\n\n"
    + "Для каждой записи:\n"
    + "- en: слово или фраза как в строке (исправь только явную опечатку).\n"
    + "- ru: точный естественный перевод на русский. Если слово многозначное и контекста нет, дай 2–3 главных значения через «; ».\n"
    + "- note: почти всегда короткая полезная заметка, одно предложение до 20 слов. Что в неё писать: для идиомы объясни образ, на котором она построена; ложного друга переводчика явно отметь как ложного друга; укажи регистр, если он не нейтральный (книжное, формальное, разговорное, устаревшее, сленг); полезную грамматическую конструкцию кратко разбери; если строка похожа на опечатку или ошибку распознавания текста, напиши вероятный правильный вариант. Оставляй note пустым только для простых общеупотребимых слов без подводных камней.\n"
    + "- Если строка — длинное составное предложение, верни И это предложение целиком отдельной записью, И дополнительно отдельные самостоятельные обороты из него (устойчивые сочетания, идиомы, конструкции, которые полезно выучить отдельно) отдельными записями. Короткие строки не разбивай.\n\n"
    + "Ответь только JSON-массивом объектов вида {\"en\":\"...\",\"ru\":\"...\",\"note\":\"...\",\"context\":\"...\"} без пояснений вокруг.\n\nСтроки:\n"
    + lines.map((l, i) => (i+1) + ". " + l).join("\n");
}
async function translateLines(lines, sourceName){
  const res = await S.sample.json(buildPrompt(lines, sourceName), { modelTier: "default" });
  const arr = Array.isArray(res) ? res : (res && Array.isArray(res.items) ? res.items : []);
  return arr.filter(x => x && typeof x.en === "string" && x.en.trim())
            .map(x => ({ en: x.en.trim(), ru: String(x.ru||"").trim(), note: String(x.note||"").trim(), context: String(x.context||"").trim() }));
}
const FATAL = new Set(["not_granted","sampling_disabled","not_declared","capability_disabled","capability_removed","session_expired"]);
function sampleErrText(e){
  const c = e && e.code;
  if(c === "not_granted") return "Доступ к Claude для этой страницы не разрешён.";
  if(c === "rate_limited") return "Слишком много запросов или исчерпан лимит Claude. Попробуй позже.";
  if(c === "session_expired") return "Нужно заново войти в Claude.";
  if(c === "invalid_json") return "Claude ответил в неожиданном формате.";
  if(FATAL.has(c)) return "Автоперевод сейчас недоступен.";
  return "Ошибка связи с Claude.";
}
async function quickTranslate(prefix, btn){
  const en = $("#"+prefix+"en").value.trim(); if(!en){ toast("Сначала впиши английское слово."); return; }
  const ctx = $("#"+prefix+"ctx").value.trim();
  const setId = $("#"+prefix+"set").value; const src = setById(setId);
  const old = btn.textContent; btn.disabled = true; btn.textContent = "Claude думает…";
  try{
    const items = await translateLines([ctx ? en + " | " + ctx : en], src && src.name);
    const it = items.find(x => key(x.en) === key(en)) || items[0];
    if(!it){ toast("Claude не вернул перевод."); }
    else { $("#"+prefix+"ru").value = it.ru; $("#"+prefix+"note").value = it.note; if(!ctx && it.context) $("#"+prefix+"ctx").value = it.context; }
  }catch(e){ toast(sampleErrText(e)); }
  btn.disabled = false; btn.textContent = old;
}

function parseLines(raw){
  const seen = new Set(), out = [];
  raw.split(/\r?\n/).map(l => l.replace(/^\s*(?:[-*•]|\d+[.)])\s+/, "").trim()).filter(Boolean)
     .forEach(l => { const k = key(l); if(!seen.has(k)){ seen.add(k); out.push(l); } });
  return out;
}

async function runBulk(lines, setId){
  const b = S.bulk; b.running = true; b.confirm = null; b.log = "";
  const src = setById(setId), log = s => { b.log += s + "\n"; const el = $("#b-log"); if(el){ el.textContent = b.log; el.scrollTop = 1e6; } };
  render(); log("Начинаю: " + plural(lines.length, "строка", "строки", "строк"));
  const existing = new Set([...S.words.values()].map(w => key(w.en)));
  let added = 0, skipped = 0, manual = 0, done = 0;
  const chunks = []; for(let i = 0; i < lines.length; i += 10) chunks.push(lines.slice(i, i+10));
  let stoppedAt = -1;
  for(let c = 0; c < chunks.length; c++){
    log(`Запрос ${c+1} из ${chunks.length}…`);
    try{
      const items = await translateLines(chunks[c], src && src.name);
      const returned = new Set();
      for(const it of items){
        returned.add(key(it.en));
        if(existing.has(key(it.en))){ skipped++; continue; }
        existing.add(key(it.en));
        persistWord(normWord({ id: uid(), ...it, set: setId, added: Date.now() })); added++;
      }
      for(const l of chunks[c]){
        const en = l.split(" | ")[0].trim();
        if(!returned.has(key(en)) && ![...returned].some(r => r.includes(key(en)) || key(en).includes(r)) && !existing.has(key(en))){
          existing.add(key(en)); manual++;
          persistWord(normWord({ id: uid(), en, context: (l.split(" | ")[1]||"").trim(), ru:"", note:"Не переведено: отредактируй вручную.", set:setId, added:Date.now() }));
        }
      }
    }catch(e){
      if(FATAL.has(e && e.code) || (e && e.code) === "rate_limited"){ log(sampleErrText(e) + " Остановлено."); stoppedAt = c; break; }
      log(sampleErrText(e) + " Строки из этого запроса добавлены без перевода.");
      for(const l of chunks[c]){
        const en = l.split(" | ")[0].trim(); if(existing.has(key(en))){ skipped++; continue; }
        existing.add(key(en)); manual++;
        persistWord(normWord({ id: uid(), en, context: (l.split(" | ")[1]||"").trim(), ru:"", note:"Не переведено: отредактируй вручную.", set:setId, added:Date.now() }));
      }
    }
    done = c + 1; renderHeader();
  }
  const left = stoppedAt >= 0 ? chunks.slice(stoppedAt).flat() : [];
  b.text = left.join("\n");
  log(`Готово. Добавлено: ${added}. Уже были: ${skipped}. Без перевода: ${manual}.` + (left.length ? ` Не обработано строк: ${left.length}, они остались в поле.` : ""));
  b.running = false; render();
}

      <p class="hint" style="margin:0">JSON со всеми словами, наборами и прогрессом. Импорт понимает и файлы из «Кодекса Тейвата».</p>
      <div class="row">
        <button class="btn grow" id="m-exp">Экспорт JSON</button>
        <button class="btn grow" id="m-imp">Импорт JSON</button>
        <button class="btn grow" id="m-show">Показать JSON</button>
        <input type="file" id="m-file" accept="application/json,.json" hidden>
      </div>
      <div id="m-out"></div>
      <div id="m-reset"><button class="btn danger wide" id="m-reset-btn">Сбросить всё</button></div>
    </div>

    <h2>Как приложение на телефоне</h2>
    <div class="panel">
      <ol class="steps">
        <li>Открой ссылку в браузере телефона, будучи залогиненным в Claude, и добавь её на главный экран через меню браузера.</li>
        <li>Для быстрого добавления слов сделай второй ярлык: та же ссылка, но с <b>#add</b> в конце. Он откроется сразу на вкладке «Добавить». Есть ещё <b>#review</b> и <b>#words</b>.</li>
      </ol>
      ${NATIVE ? `<p style="margin:0"><span class="chip">${OFFLINE ? "Офлайн-копия в приложении «Словник»" : "Открыто в приложении «Словник», связь с ним есть"}</span></p>` : ""}
      <p class="hint" style="margin:0">Во время повторения экран не гаснет. Если связь пропадёт, изменения сохранятся на устройстве и отправятся сами. Нужен интернет: слова хранятся в облаке Claude и синхронизируются между устройствами.</p>
    </div>`;
  $("#m-sets").onclick = openSets;
  v.querySelectorAll("[data-seed]").forEach(b => b.onclick = () => {
    applySeed(b.dataset.seed);
    v.querySelectorAll("[data-seed]").forEach(x => x.setAttribute("aria-pressed", x === b));
  });
  $("#m-level").onchange = e => { S.meta.level = e.target.value; persistMeta(); };
  $("#m-len").onchange = e => { S.meta.sessionLen = +e.target.value; persistMeta(); renderHeader(); };
  if($("#m-tts")) $("#m-tts").onchange = e => { S.meta.ttsAuto = e.target.checked; persistMeta(); };
  if($("#acc-us")) $("#acc-us").onclick = () => { S.meta.accent = "en-US"; persistMeta(); render(); speak("Hello! This is how I sound."); };
  if($("#acc-gb")) $("#acc-gb").onclick = () => { S.meta.accent = "en-GB"; persistMeta(); render(); speak("Hello! This is how I sound."); };
  if($("#m-say")) $("#m-say").onclick = () => speak("The quick brown fox jumps over the lazy dog.");
  const saveNotif = () => {
    const n = { ...DEFAULT_META.notif, ...(S.meta.notif || {}) };
    n.on = $("#n-on").checked; n.time = $("#n-time").value || n.time; n.quiz = +$("#n-quiz").value;
    n.quietFrom = $("#n-qf").value || n.quietFrom; n.quietTo = $("#n-qt").value || n.quietTo;
    S.meta.notif = n; persistMeta();
    nativeCall("notifSettings", JSON.stringify(n));
    $("#n-more").hidden = !n.on;
  };
  ["n-on","n-time","n-quiz","n-qf","n-qt"].forEach(id => { const el = $("#" + id); if(el) el.onchange = saveNotif; });
  v.querySelectorAll("[data-ntest]").forEach(b => b.onclick = () => nativeCall("testNotification", b.dataset.ntest));
  $("#m-sound").onchange = e => { S.meta.sound = e.target.checked; persistMeta(); if(e.target.checked) fx("good"); };
  $("#m-hap").onchange = e => { S.meta.haptics = e.target.checked; persistMeta(); if(e.target.checked) haptic("confirm"); };
  $("#m-exp").onclick = exportJson;
  $("#m-imp").onclick = () => $("#m-file").click();
  $("#m-show").onclick = () => showJson();
  $("#m-file").onchange = e => { const f = e.target.files[0]; e.target.value = ""; if(f) readImport(f); };
  $("#m-reset-btn").onclick = () => {
    $("#m-reset").innerHTML = `<div class="panel" style="background:var(--bg)"><span>Удалить ${plural(S.words.size,"слово","слова","слов")} и ${plural(S.meta.sets.length,"набор","набора","наборов")} вместе с прогрессом? Отменить это нельзя. Сначала можно сделать экспорт.</span><div class="row"><button class="btn danger solid grow" id="m-r2">Удалить всё</button><button class="btn grow" id="m-r-no">Отмена</button></div></div>`;
    $("#m-r-no").onclick = () => render();
    $("#m-r2").onclick = () => {
      for(const id of [...S.words.keys()]) removeWord(id);
      S.meta = { ...structuredClone(DEFAULT_META), level: S.meta.level, sessionLen: S.meta.sessionLen }; persistMeta();
      S.session = null; toast("Всё удалено"); refresh();
    };
  };
}
function exportData(){ return JSON.stringify({ app:"slovnik", version:1, exported:new Date().toISOString(), meta:S.meta, words:[...S.words.values()].map(w => ({ id:w.id, ...plain(w) })) }, null, 2); }
async function exportJson(){
  const data = exportData(), name = "slovnik-" + localDate() + ".json";
  if(NATIVE && typeof NATIVE.saveFile === "function"){
    if(nativeCall("saveFile", name, data)) return;
  }
  if(S.downloads && !NATIVE){
    try{ await S.downloads.save({ filename: name, data }); toast("Файл сохранён"); return; }
    catch(e){ if(e && e.code === "declined") return; }
  }
  showJson(data, name);
}
function localDate(){ const d = new Date(); return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0"); }
function showJson(data, name){
  data = data || exportData(); name = name || "slovnik-" + localDate() + ".json";
  $("#m-out").innerHTML = `<label class="f">Скопируй и сохрани этот текст как ${esc(name)}<textarea id="m-json" readonly>${esc(data)}</textarea></label><button class="btn" id="m-copy">Скопировать</button>`;
  $("#m-copy").onclick = async () => { const t = $("#m-json"); try{ await navigator.clipboard.writeText(t.value); toast("Скопировано"); }catch(e){ t.focus(); t.select(); } };
}
function fromForeign(parsed){
  const meta = { sets: [] }, setByName = new Map();
  const addSet = (name, emoji) => { const k = key(name); if(!k) return ""; if(!setByName.has(k)){ const s = { id: sid() + setByName.size, name: String(name), emoji: emoji || "📘" }; setByName.set(k, s); meta.sets.push(s); } return setByName.get(k).id; };
  if(parsed.meta && Array.isArray(parsed.meta.sets)){ parsed.meta.sets.forEach(s => { if(s && s.id && s.name){ meta.sets.push({ id:String(s.id), name:String(s.name), emoji:String(s.emoji||"📘") }); setByName.set(key(s.name), meta.sets[meta.sets.length-1]); } }); }
  (parsed.regions||[]).forEach(r => r && r.name && addSet(r.name, r.emoji));
  const raw = Array.isArray(parsed) ? parsed : parsed.words;
  const words = (raw||[]).map(w => {
    if(!w) return null;
    const en = w.en ?? w.english ?? w.word ?? w.front, ru = w.ru ?? w.russian ?? w.translation ?? w.back;
    if(!en) return null;
    if(w.lv && w.due) return normWord(w);
    const revKey = Object.keys(w).find(k => /^(level|lvl)[_-]?(rev|reverse|ru|ruen|ru_en|ru2en)$/i.test(k) || /^(rev|reverse|ru)[_-]?(level|lvl)$/i.test(k));
    const revDueKey = Object.keys(w).find(k => /due/i.test(k) && /(rev|reverse|ru)/i.test(k));
    let set = "";
    if(w.set && meta.sets.some(s => s.id === w.set)) set = w.set; else if(w.region || w.set) set = addSet(w.region || w.set);
    return normWord({ id: w.id, en, ru, note: w.note || w.comment, context: w.context || w.example, set,
      lv: { en: w.level, ru: revKey ? w[revKey] : 0 }, due: { en: w.nextDue, ru: revDueKey ? w[revDueKey] : 0 },
      ok: w.correct ?? w.ok, bad: w.wrong ?? w.bad, added: w.addedAt ?? w.added });
  }).filter(Boolean);
  return { meta, words };
}
function readImport(file){
  const r = new FileReader();
  r.onload = () => {
    let parsed; try{ parsed = JSON.parse(r.result); }catch(e){ toast("Файл не читается как JSON."); return; }
    const { meta, words } = fromForeign(parsed);
    if(!words.length){ toast("В файле не нашлось слов."); return; }
    openModal(`
      <h3>Импорт</h3>
      <p style="margin:0">В файле ${plural(words.length,"слово","слова","слов")} и ${plural(meta.sets.length,"набор","набора","наборов")}.</p>
      <button class="btn primary" id="i-merge">Добавить к текущим (дубли пропущу)</button>
      <button class="btn danger" id="i-replace">Заменить весь словарь</button>
      <button class="btn" id="i-cancel">Отмена</button>`, () => {
      $("#i-cancel").onclick = closeModal;
      $("#i-merge").onclick = () => {
        const have = new Set([...S.words.values()].map(w => key(w.en)));
        const idMap = {};
        meta.sets.forEach(s => { const ex = S.meta.sets.find(x => key(x.name) === key(s.name)); if(ex) idMap[s.id] = ex.id; else { S.meta.sets.push(s); idMap[s.id] = s.id; } });
        let n = 0;
        words.forEach(w => { if(have.has(key(w.en))) return; have.add(key(w.en)); w.set = w.set ? (idMap[w.set] || "") : ""; if(S.words.has(w.id)) w.id = uid(); persistWord(w); n++; });
        persistMeta(); closeModal(); toast("Добавлено " + plural(n,"слово","слова","слов"));
      };
      $("#i-replace").onclick = () => {
        for(const id of [...S.words.keys()]) removeWord(id);
        S.meta = { ...structuredClone(DEFAULT_META), level: S.meta.level, sessionLen: S.meta.sessionLen, sets: meta.sets };
        const seen = new Set();
        words.forEach(w => { if(seen.has(key(w.en))) return; seen.add(key(w.en)); persistWord(w); });
        persistMeta(); S.session = null; closeModal(); toast("Словарь заменён");
      };
    });
  };
  r.readAsText(file);
}

/* ---------- app-like extras: fullscreen, wake lock, deep links ---------- */
let wakeLock = null;
async function holdScreen(on){
  try{
    if(on && !wakeLock && navigator.wakeLock && document.visibilityState === "visible"){ wakeLock = await navigator.wakeLock.request("screen"); wakeLock.addEventListener("release", () => { wakeLock = null; }); }
    if(!on && wakeLock){ const l = wakeLock; wakeLock = null; await l.release(); }
  }catch(e){ wakeLock = null; }
}
document.addEventListener("visibilitychange", () => { if(document.visibilityState === "visible") holdScreen(!!S.session); });
setInterval(() => holdScreen(!!S.session), 3000);
const TABS = ["review","words","add","more"];
function tabFromHash(){ const h = (location.hash || "").slice(1); return TABS.includes(h) ? h : null; }
window.addEventListener("hashchange", () => { const t = tabFromHash(); if(t && t !== S.tab){ S.tab = t; S.animView = true; refresh(); } });

/* ---------- boot ---------- */
applySeed(getSeed());
document.querySelectorAll(".nav button").forEach(b => b.onclick = () => {
  if(S.tab === b.dataset.tab) return;
  haptic("tick");
  S.sel = null;
  S.tab = b.dataset.tab; S.animView = true; refresh(); window.scrollTo(0,0);
});
S.tab = tabFromHash() || S.tab;
loadLocal();
nativeCall("pageAlive");
window.addEventListener("error", e => nativeCall("jsLog", "ошибка: " + e.message + " @" + e.lineno));
window.addEventListener("unhandledrejection", e => nativeCall("jsLog", "промис: " + (e.reason && (e.reason.message || e.reason.code) || e.reason)));
if(OFFLINE){ loadOfflineSnapshot(); S.mode = "offline"; S.capsReady = true; mergeNativeDays(); refresh(); nativeCall("jsLog", "офлайн-копия: " + S.words.size + " слов, копия словаря " + (S.noSnapshot ? "отсутствует" : "есть")); }
else { refresh(); initCaps(); reportPage(); }
})();
</script>
