plugins {
    id 'com.android.application'
}

def runNumber = (System.getenv('GITHUB_RUN_NUMBER') ?: '1') as int
// Human version (semver) lives in /VERSION; versionCode is the CI run number, so every build installs over the previous one.
def appVersion = rootProject.file('VERSION').text.trim()

android {
    namespace 'app.slovnik'
    compileSdk 35

    defaultConfig {
        applicationId 'app.slovnik'
        minSdk 29
        targetSdk 34
        versionCode runNumber
        versionName appVersion
    }

    signingConfigs {
        release {
            storeFile rootProject.file('keystore/release.jks')
            storePassword 'slovnik-store'
            keyAlias 'slovnik'
            keyPassword 'slovnik-store'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}
