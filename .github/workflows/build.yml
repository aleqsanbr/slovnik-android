name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Signing key
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            mkdir -p keystore && echo "$KEYSTORE_B64" | base64 -d > keystore/release.jks
          fi
          test -f keystore/release.jks || { echo "::error::No keystore/release.jks and no KEYSTORE_B64 secret"; exit 1; }

      - name: Build
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Rename
        run: cp app/build/outputs/apk/release/app-release.apk slovnik-${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: slovnik-apk
          path: slovnik-${{ github.run_number }}.apk

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Словник 1.0.${{ github.run_number }}
          files: slovnik-${{ github.run_number }}.apk
          make_latest: true
