name: Delete old releases

on:
  push:
    branches: [main]
    paths: ['.github/workflows/cleanup-tags.yml']

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete releases v1.0.1–v1.0.7 and their tags
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          for t in v1.0.1 v1.0.2 v1.0.3 v1.0.4 v1.0.5 v1.0.6 v1.0.7; do
            gh release delete "$t" --cleanup-tag --yes || true
            gh api -X DELETE "repos/$GH_REPO/git/refs/tags/$t" 2>/dev/null || true
          done
